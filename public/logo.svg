<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Fixconnexion">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BC0FF"/>
      <stop offset="55%" stop-color="#1FA8FF"/>
      <stop offset="100%" stop-color="#C5FF4A"/>
    </linearGradient>
  </defs>
  <!-- Mark: two nodes linked by a circuit line, forming an abstract FC -->
  <g transform="translate(8,12)">
    <!-- Connection path -->
    <path d="M6 4 L24 4 L24 26 L42 26" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Second branch to suggest "C" arc -->
    <path d="M42 26 Q48 26 48 20" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <!-- Outer C arc -->
    <path d="M30 8 Q14 8 14 20 Q14 32 30 32" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="6" cy="4" r="3.5" fill="#05060A" stroke="url(#g)" stroke-width="3"/>
    <circle cx="42" cy="26" r="3.5" fill="url(#g)"/>
    <circle cx="14" cy="20" r="2.5" fill="#C5FF4A"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(72,0)" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600">
    <text x="0" y="32" font-size="22" letter-spacing="-0.5" fill="#FFFFFF">Fix</text>
    <text x="40" y="32" font-size="22" letter-spacing="-0.5" fill="url(#g)">connexion</text>
    <text x="0" y="50" font-size="9" letter-spacing="3" font-family="'JetBrains Mono', monospace" fill="#5BC0FF" opacity="0.85">APPS  CREATIVE  AGENCY</text>
  </g>
</svg>
